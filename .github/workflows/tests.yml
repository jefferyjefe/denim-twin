name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy opencv-contrib-python-headless pillow pyyaml jsonschema scikit-image scipy pytest
      - run: python -m pytest -q tests
      - run: python tools/sentinel.py && python tools/scope_check.py && python tools/protocol_audit.py || true
