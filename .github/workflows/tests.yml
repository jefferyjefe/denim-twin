name: tests
on: [push, pull_request]

jobs:
  # The clean-CI verification: a fresh checkout with no photographs, no masks, no model weights,
  # no credentials and nothing fetched from the network. This job is deliberately the WEAKER of the
  # two claims this repository can make, and naming it that way is the point -- see
  # docs/PROJECT_STATUS.md. It proves the repository is internally consistent. It proves nothing
  # about physical prediction accuracy, and tools/verify.py prints that in its own summary so a
  # green tick here can never be quoted as a scientific result.
  clean-ci:
    name: clean-CI verification (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # Pinned, and the same file a contributor installs. This step used to be an inline package
      # list that differed from requirements.txt in four packages, so "what CI runs" and "what the
      # instructions say to install" were two environments and neither was reproducible.
      - run: pip install -r requirements-ci.txt

      # The hermetic profile must STAY hermetic. tests/test_repeatability_harness.py imported a tool
      # that imported torch at module level, which aborted pytest collection here for as long as
      # torch was absent -- and would have been masked forever the day someone added torch to this
      # job "to fix CI". If the heavy optional dependencies ever become installed in this job, the
      # clean-CI claim quietly stops being tested. So assert their absence.
      - name: assert the clean-CI environment really is clean
        run: |
          python - <<'PY'
          import importlib.util, sys
          heavy = [m for m in ("torch", "torchvision", "segment_anything", "open_clip")
                   if importlib.util.find_spec(m) is not None]
          if heavy:
              sys.exit(f"{heavy} installed in the clean-CI job. This job exists to prove the "
                       f"repository verifies WITHOUT them; installing them here would hide exactly "
                       f"the defect it is guarding. The heavy extras live in requirements.txt; "
                       f"exercise them in a --profile full run on a machine that has the evidence.")
          import os
          if os.path.exists("models/sam_vit_b_01ec64.pth"):
              sys.exit("the SAM checkpoint is present in the clean-CI job; see above.")
          print("clean: no torch, no torchvision, no segment_anything, no open_clip, no checkpoint")
          PY

      # One gate, one exit code. This previously ran sentinel/scope_check/protocol_audit with
      # `|| true`, so three checks could not fail the build and caught nothing for months
      # (scope_check was flagging the line that declares its own ban). tools/verify.py runs the
      # required checks blocking and the advisory ones as warnings. The bench and every other check
      # that needs pair artefacts is excluded by the ci profile itself rather than by a flag, and
      # anything whose evidence is absent is reported NOT RUN rather than passed.
      #
      # Exit codes: 0 pass, 1 a required check failed, 2 the profile could not be satisfied.
      - run: python tools/verify.py --profile ci --no-bench --json /tmp/verify-ci.json

      - name: verification summary
        if: always()
        run: cat /tmp/verify-ci.json || echo "no summary written"

  # The real-plan proof, and deliberately NOT part of clean-CI above.
  #
  # `clean-ci` runs tools/verify.py --profile ci, whose pilot check is the ORDINARY self-test. That
  # run's three gate positive controls are on `_mini_spec`, a four-shot fixture: enough to show the
  # wiring is connected, not that the plan an operator will actually shoot can be satisfied. The
  # real 424-frame plan is driven to READY at all three gates only behind `--full`, and that is also
  # the only place the single-fault negative controls run. So until this job existed, nothing in CI
  # had ever proved the production plan opens the gates -- the claim rested on somebody having run
  # it by hand.
  #
  # It is a separate job with a name that cannot be mistaken for the ordinary build, because the two
  # prove different things and a green tick on one must never be quoted for the other. It is not on
  # every push: it synthesises the whole plan's frames and takes tens of minutes. It is hermetic --
  # no network, no weights, no photographs, no gitignored evidence -- so it needs nothing this
  # runner does not already have.
  real-plan-proof:
    name: real-plan proof (424-frame plan, all three gates)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-ci.txt

      # The switch, run directly rather than through a profile, so the log says exactly what ran.
      # 125 scenarios: the ordinary 103 plus the real-plan positive controls at all three gates and
      # the single-fault negative controls built from that one valid session.
      - name: drive the real 424-frame plan to READY at all three gates
        run: python tools/pilot.py selftest --full

      - name: what this job proves, and what it does not
        if: always()
        run: |
          echo "PROVES: one synthetic garment can be driven through the committed 424-frame shot"
          echo "plan, and ready_to_cut, ready_to_wash and ready_to_finalize each open on it with no"
          echo "blockers; and that each single-fault mutant of that session is refused by the one"
          echo "condition its fault breaks."
          echo
          echo "DOES NOT PROVE: anything about a real garment, a real rig, a real phone or a real"
          echo "cut. Every frame in this run was synthesised. See docs/PILOT_REHEARSALS.md for the"
          echo "three rehearsals a person has to perform, and docs/PILOT_OWNER_DECISIONS.md for the"
          echo "decisions that are not the software's to make."
